
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault | Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="auth-container">
    <section class="auth-card">
        <a class="brand auth-brand" th:href="@{/}">TrustVault</a>

        <p class="eyebrow">SECURE DOCUMENT ACCESS</p>
        <h1>Welcome back</h1>
        <p>Sign in to access your private workspace.</p>

        <p class="alert error" th:if="${param.error}">
            Invalid email or password.
        </p>

        <p class="alert success" th:if="${param.logout}">
            You have logged out successfully.
        </p>

        <p class="alert success"
           th:if="${registeredMessage}"
           th:text="${registeredMessage}">
        </p>

        <form th:action="@{/login}" method="post">

            <label for="username">Email address</label>
            <input
                type="email"
                id="username"
                name="username"
                placeholder="Enter your email"
                autocomplete="username"
                required>

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required>

            <button type="submit" class="button">
                Sign in
            </button>

        </form>

        <p class="auth-footer">
            <a th:href="@{/forgot-password}">Forgot password?</a>
        </p>

        <p class="auth-footer">
            Don't have an account?
            <a th:href="@{/register}">Create an account</a>
        </p>

    </section>
</main>
</body>
</html>
