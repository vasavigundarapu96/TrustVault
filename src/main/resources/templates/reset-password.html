
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault | Reset Password</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="auth-container">
    <section class="auth-card">
        <a class="brand auth-brand" th:href="@{/login}">TrustVault</a>
        <p class="eyebrow">SECURE YOUR ACCOUNT</p>
        <h1>Reset password</h1>
        <p>Choose a new 8-character password.</p>

        <p class="alert error" th:if="${error}" th:text="${error}"></p>

        <form th:action="@{/reset-password}"
              method="post" class="form-grid">

            <label for="password">New password</label>
            <input id="password"
                   type="password"
                   name="password"
                   minlength="8"
                   maxlength="8"
                   pattern="(?=.*[A-Za-z])(?=.*[0-9])(?=.*[^A-Za-z0-9\s])\S{8}"
                   title="Exactly 8 characters, including a letter, a digit, and a special character."
                   autocomplete="new-password"
                   required>

            <label for="confirmPassword">Confirm new password</label>
            <input id="confirmPassword"
                   type="password"
                   name="confirmPassword"
                   minlength="8"
                   maxlength="8"
                   autocomplete="new-password"
                   required>

            <button class="button" type="submit">
                Reset Password
            </button>
        </form>
    </section>
</main>
</body>
</html>
