
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault | Forgot Password</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="auth-container">
    <section class="auth-card">
        <a class="brand auth-brand" th:href="@{/login}">TrustVault</a>
        <p class="eyebrow">ACCOUNT RECOVERY</p>
        <h1>Forgot password?</h1>
        <p>Enter your registered email to continue recovery.</p>

        <p class="alert error" th:if="${error}" th:text="${error}"></p>
        <p th:if="${message}" th:text="${message}"></p>

        <form th:action="@{/forgot-password}"
              method="post" class="form-grid">
            <label for="email">Email address</label>
            <input id="email" type="email" name="email"
                   maxlength="150" autocomplete="email" required>

            <button class="button" type="submit">Continue</button>
        </form>

        <p class="auth-footer">
            <a th:href="@{/login}">Back to sign in</a>
        </p>
    </section>
</main>
</body>
</html>
